[pytest]
# Collect BOTH the top-level suite and the app/tests integration suite.
# (app/tests — 187 tests — was previously excluded from the default run.)
testpaths = tests app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    -m "not perf"
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    postgres: requires PostgreSQL (UUID / gen_random_uuid DDL)
    slow: mark test as slow running
    perf: opt-in wall-clock performance benchmarks; excluded by default and require BRIGADE_BENCHMARK=1
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
