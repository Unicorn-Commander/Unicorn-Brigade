[pytest]
# Collect BOTH the top-level suite and the app/tests integration suite.
# (app/tests — 187 tests — was previously excluded from the default run.)
testpaths = tests app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    slow: mark test as slow running
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
