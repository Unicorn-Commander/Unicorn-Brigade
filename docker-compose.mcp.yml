version: '3.8'

# MCP Services - Code Sandbox, Browser Automation, etc.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.mcp.yml up -d

services:
  # =============================================================================
  # Code Sandbox (Self-Hosted)
  # =============================================================================
  # Secure code execution environment for AI agents
  # Supports Python, JavaScript, TypeScript, Bash

  code-sandbox:
    image: python:3.11-slim
    container_name: brigade-code-sandbox
    volumes:
      # Mount Docker socket for container-in-container execution
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace for code execution
      - sandbox-workspace:/workspace
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SANDBOX_TIMEOUT=30
      - SANDBOX_MAX_MEMORY=512m
      - SANDBOX_MAX_CPU=1
    networks:
      - brigade-network
    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Browserless Chrome (Self-Hosted Browser Automation)
  # =============================================================================
  # Headless Chrome for Playwright/Puppeteer MCP servers
  # Provides remote browser control for AI agents

  browserless:
    image: browserless/chrome:latest
    container_name: brigade-browserless
    ports:
      - "3333:3000"
    environment:
      # Connection settings
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=20
      # Security
      - ENABLE_DEBUGGER=false
      - ENABLE_XVFB=true
      # Performance
      - PREBOOT_CHROME=true
      - KEEP_ALIVE=true
      # Optional token auth (uncomment for production)
      # - TOKEN=your-secret-token
    networks:
      - brigade-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # Alternative: Steel Browser (Open Source)
  # =============================================================================
  # Battery-included browser sandbox with proxy support
  # Uncomment to use instead of browserless

  # steel-browser:
  #   image: ghcr.io/steel-dev/steel:latest
  #   container_name: brigade-steel
  #   ports:
  #     - "3334:3000"
  #   environment:
  #     - STEEL_LOG_LEVEL=info
  #   networks:
  #     - brigade-network
  #   restart: unless-stopped

  # =============================================================================
  # MCP Server Manager (Optional)
  # =============================================================================
  # Manages MCP server processes in a container
  # Useful for running multiple MCP servers in isolation

  mcp-manager:
    image: node:20-slim
    container_name: brigade-mcp-manager
    volumes:
      - mcp-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: >
      sh -c "
        npm install -g @modelcontextprotocol/server-github @modelcontextprotocol/server-filesystem @playwright/mcp &&
        echo 'MCP servers installed' &&
        tail -f /dev/null
      "
    environment:
      # GitHub MCP
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_TOKEN}
      # Filesystem MCP
      - WORKSPACE_PATH=/workspace
      # Playwright MCP
      - PLAYWRIGHT_BROWSERS_PATH=/app/.cache/ms-playwright
    networks:
      - brigade-network
    restart: unless-stopped

networks:
  brigade-network:
    external: true

volumes:
  sandbox-workspace:
    driver: local
  mcp-data:
    driver: local
