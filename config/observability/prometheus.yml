# Prometheus scrape + alerting config for Unicorn Brigade.
#
# Scrapes originate from inside brigade-network, so their source IP is a
# private docker address — Brigade's /metrics gate (_metrics_authorized)
# admits them without a token. If you set METRICS_TOKEN on brigade-api,
# uncomment the `authorization` block below and supply the same value.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # wire Alertmanager here if/when deployed

scrape_configs:
  # Application + domain metrics (HTTP, agent chat, tool calls, scheduled runs).
  - job_name: brigade-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["brigade-api:8100"]
    # authorization:
    #   type: Bearer
    #   credentials: "REPLACE_WITH_METRICS_TOKEN"

  # Readiness probe via blackbox-exporter — surfaces DB-pool / scheduler health
  # (HTTP 503 from /readyz → probe_success 0 → BrigadeReadinessDown fires).
  - job_name: brigade-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://brigade-api:8100/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: brigade-blackbox:9115

  # Liveness probe (process-up), for reference / dashboards.
  - job_name: brigade-livez
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://brigade-api:8100/livez"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: brigade-blackbox:9115
