# LiveKit Server Configuration
# Documentation: https://docs.livekit.io/realtime/self-hosting/deployment/

# Port configuration
port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  # Use TCP fallback for restricted networks
  tcp_port: 7881
  # Enable TURN for NAT traversal (recommended for production)
  use_ice_lite: true

# API keys (loaded from environment)
# In production, use a proper key management system
keys:
  # API key: secret (at least 32 characters)
  # These are overridden by LIVEKIT_API_KEY and LIVEKIT_API_SECRET env vars
  devkey: REMOVED

# Logging
logging:
  level: info
  # Structured JSON logging for production
  # json: true

# Room settings
room:
  # Enable automatic room creation when first participant joins
  auto_create: true
  # Max participants per room (0 = unlimited)
  max_participants: 10
  # Empty room timeout (seconds)
  empty_timeout: 300
  # Departure timeout - time before removing participant after disconnect
  departure_timeout: 20

# WebRTC settings
webrtc:
  # Congestion control
  congestion_control:
    enabled: true
    probe_mode: padding

# Codec settings
codec:
  # Prefer Opus for audio (best for voice)
  opus:
    fec: true  # Forward error correction for lossy networks

# Redis configuration (for multi-node deployments)
# redis:
#   address: livekit-redis:6379
#   db: 0

# TURN server (for NAT traversal in production)
# turn:
#   enabled: true
#   domain: your-domain.com
#   cert_file: /path/to/cert.pem
#   key_file: /path/to/key.pem
#   tls_port: 5349
#   udp_port: 3478

# Prometheus metrics (optional)
# prometheus:
#   port: 6789
