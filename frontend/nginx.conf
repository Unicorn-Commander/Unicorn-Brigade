# Unicorn Brigade Frontend — Nginx Configuration (Static Only)
# API traffic is routed by Traefik directly to brigade-backend (priority 100)
# This server only serves the React SPA bundle.

server {
    listen 80;
    large_client_header_buffers 4 64k;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Security Headers ────────────────────────────────────────────────────
    # Ops-Center at https://unicorncommander.ai embeds the Brigade UI. Keep the
    # frame allowlist exact; X-Frame-Options cannot express this cross-origin
    # parent, so CSP frame-ancestors is the authoritative framing policy.
    add_header Content-Security-Policy "frame-ancestors 'self' https://unicorncommander.ai https://*.unicorncommander.ai https://magicunicorn.dev https://*.magicunicorn.dev" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # ── Static Asset Caching ────────────────────────────────────────────────
    # Vite hashed assets — cache aggressively (fingerprinted filenames)
    location /assets/ {
        expires 1y;
        add_header Content-Security-Policy "frame-ancestors 'self' https://unicorncommander.ai https://*.unicorncommander.ai https://magicunicorn.dev https://*.magicunicorn.dev" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images, fonts, and other static files
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Content-Security-Policy "frame-ancestors 'self' https://unicorncommander.ai https://*.unicorncommander.ai https://magicunicorn.dev https://*.magicunicorn.dev" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── SPA Routing ─────────────────────────────────────────────────────────
    # React Router: serve index.html for all non-file routes.
    # index.html must never be cached: without an explicit Cache-Control,
    # Cloudflare applies a 4h browser TTL and users keep running stale
    # bundles (with stale asset hashes) after every deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "frame-ancestors 'self' https://unicorncommander.ai https://*.unicorncommander.ai https://magicunicorn.dev https://*.magicunicorn.dev" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Health Check ────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Security-Policy "frame-ancestors 'self' https://unicorncommander.ai https://*.unicorncommander.ai https://magicunicorn.dev https://*.magicunicorn.dev" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Type text/plain;
    }

    # ── Deny Hidden Files ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        add_header Content-Security-Policy "frame-ancestors 'self' https://unicorncommander.ai https://*.unicorncommander.ai https://magicunicorn.dev https://*.magicunicorn.dev" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        access_log off;
        log_not_found off;
    }
}
