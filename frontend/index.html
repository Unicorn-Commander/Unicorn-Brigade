<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Unicorn Brigade - AI Agent Factory</title>
    <!-- Resolve the theme before first paint to avoid a flash. Reads the saved
         preference (brigade-preferences.theme: 'system'|'light'|'dark'); falls
         back to the OS prefers-color-scheme. Kept in sync at runtime by
         src/utils/theme.js. -->
    <script>
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('brigade-preferences') || '{}');
          var choice = prefs.theme || 'system';
          var dark =
            choice === 'dark' ||
            (choice !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.classList.toggle('dark', dark);
        } catch (e) {
          /* default markup (class="dark") already renders dark */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
