<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Glitter Mane - AI Clinical Maestro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .message-bubble {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-indicator {
            display: inline-flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #fff;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .sparkle {
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        .medical-record-card {
            transition: all 0.3s ease;
        }

        .medical-record-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .upload-zone.dragover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .scroll-to-bottom {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = 'http://localhost:3333/api';

        function DrGlitterManeApp() {
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [sessionId] = useState(() => 'session_' + Date.now());
            const [userId] = useState(() => 'user_' + Math.random().toString(36).substr(2, 9));
            const [agentInfo, setAgentInfo] = useState(null);
            const [medicalRecords, setMedicalRecords] = useState([]);
            const [showUpload, setShowUpload] = useState(false);
            const [isDragging, setIsDragging] = useState(false);
            const messagesEndRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                loadAgentInfo();
                loadMedicalRecords();
            }, []);

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const loadAgentInfo = async () => {
                try {
                    const response = await fetch(`${API_URL}/agent`);
                    const data = await response.json();
                    setAgentInfo(data);

                    // Add greeting message
                    setMessages([{
                        id: 'greeting',
                        type: 'agent',
                        content: data.agent.greeting,
                        timestamp: new Date()
                    }]);
                } catch (error) {
                    console.error('Failed to load agent info:', error);
                }
            };

            const loadMedicalRecords = async () => {
                try {
                    const response = await fetch(`${API_URL}/records/${userId}`);
                    const data = await response.json();
                    setMedicalRecords(data.documents || []);
                } catch (error) {
                    console.error('Failed to load medical records:', error);
                }
            };

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            const sendMessage = async () => {
                if (!inputMessage.trim()) return;

                const userMessage = {
                    id: Date.now().toString(),
                    type: 'user',
                    content: inputMessage,
                    timestamp: new Date()
                };

                setMessages(prev => [...prev, userMessage]);
                setInputMessage('');
                setIsTyping(true);

                try {
                    const response = await fetch(`${API_URL}/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: inputMessage,
                            sessionId,
                            userId
                        })
                    });

                    const data = await response.json();

                    const agentMessage = {
                        id: (Date.now() + 1).toString(),
                        type: 'agent',
                        content: data.response,
                        timestamp: new Date()
                    };

                    setMessages(prev => [...prev, agentMessage]);
                } catch (error) {
                    console.error('Chat error:', error);
                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        type: 'agent',
                        content: 'I apologize, but I encountered an error. Please try again.',
                        timestamp: new Date()
                    }]);
                } finally {
                    setIsTyping(false);
                }
            };

            const handleFileUpload = async (file) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('userId', userId);
                formData.append('documentType', 'medical_record');

                try {
                    const response = await fetch(`${API_URL}/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        setMessages(prev => [...prev, {
                            id: Date.now().toString(),
                            type: 'system',
                            content: `✅ Medical record "${file.name}" uploaded successfully. ${data.document.chunksProcessed} sections processed for analysis.`,
                            timestamp: new Date()
                        }]);

                        loadMedicalRecords();
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    setMessages(prev => [...prev, {
                        id: Date.now().toString(),
                        type: 'system',
                        content: '❌ Failed to upload medical record. Please try again.',
                        timestamp: new Date()
                    }]);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);

                const files = Array.from(e.dataTransfer.files);
                if (files.length > 0) {
                    handleFileUpload(files[0]);
                }
            };

            const formatContent = (content) => {
                // Convert markdown-style formatting to HTML
                let formatted = content
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n• /g, '\n<li>')
                    .replace(/\n\n/g, '</p><p>')
                    .replace(/\n/g, '<br/>');

                // Wrap in paragraph tags
                if (!formatted.startsWith('<p>')) {
                    formatted = `<p>${formatted}</p>`;
                }

                // Handle bullet points
                formatted = formatted.replace(/(<li>.*?)(?=<li>|<\/p>|$)/g, '<ul class="list-disc pl-6 mt-2">$1</ul>');

                return { __html: formatted };
            };

            return (
                <div className="min-h-screen p-4">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="glass-morphism rounded-2xl p-6 mb-4 text-white">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-4">
                                    <div className="text-5xl sparkle">🦄</div>
                                    <div>
                                        <h1 className="text-2xl font-bold">Dr. Glitter Mane</h1>
                                        <p className="text-sm opacity-90">AI Clinical Maestro</p>
                                    </div>
                                </div>
                                <div className="flex space-x-3">
                                    <button
                                        onClick={() => setShowUpload(!showUpload)}
                                        className="px-4 py-2 bg-white bg-opacity-20 rounded-lg hover:bg-opacity-30 transition-all flex items-center space-x-2"
                                    >
                                        <span>📄</span>
                                        <span>Medical Records ({medicalRecords.length})</span>
                                    </button>
                                    <button className="px-4 py-2 bg-white bg-opacity-20 rounded-lg hover:bg-opacity-30 transition-all flex items-center space-x-2">
                                        <span>📊</span>
                                        <span>Analytics</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Upload Section */}
                        {showUpload && (
                            <div className="glass-morphism rounded-2xl p-6 mb-4 text-white">
                                <h2 className="text-lg font-semibold mb-4">📁 Medical Records</h2>

                                <div
                                    className={`upload-zone rounded-lg p-8 text-center mb-4 ${isDragging ? 'dragover' : ''}`}
                                    onDragOver={(e) => {
                                        e.preventDefault();
                                        setIsDragging(true);
                                    }}
                                    onDragLeave={() => setIsDragging(false)}
                                    onDrop={handleDrop}
                                >
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        className="hidden"
                                        accept=".pdf,.txt,.doc,.docx,.png,.jpg,.jpeg"
                                        onChange={(e) => {
                                            if (e.target.files[0]) {
                                                handleFileUpload(e.target.files[0]);
                                            }
                                        }}
                                    />
                                    <div className="text-4xl mb-2">📤</div>
                                    <p className="font-medium mb-2">Drop medical records here</p>
                                    <p className="text-sm opacity-75 mb-4">or</p>
                                    <button
                                        onClick={() => fileInputRef.current?.click()}
                                        className="px-6 py-2 bg-white bg-opacity-20 rounded-lg hover:bg-opacity-30 transition-all"
                                    >
                                        Browse Files
                                    </button>
                                    <p className="text-xs mt-4 opacity-75">
                                        Supported: PDF, Images, Word docs, Text files
                                    </p>
                                </div>

                                {medicalRecords.length > 0 && (
                                    <div className="grid grid-cols-2 gap-3">
                                        {medicalRecords.map(record => (
                                            <div key={record.id} className="medical-record-card glass-morphism rounded-lg p-3">
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center space-x-2">
                                                        <span className="text-2xl">📄</span>
                                                        <div>
                                                            <p className="font-medium text-sm">{record.fileName}</p>
                                                            <p className="text-xs opacity-75">
                                                                {new Date(record.uploadDate).toLocaleDateString()}
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <span className="text-xs px-2 py-1 bg-white bg-opacity-20 rounded">
                                                        {record.chunks} chunks
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Chat Area */}
                        <div className="glass-morphism rounded-2xl p-6">
                            {/* Disclaimers */}
                            {agentInfo && (
                                <div className="bg-yellow-500 bg-opacity-20 border border-yellow-400 border-opacity-50 rounded-lg p-3 mb-4 text-white text-xs">
                                    ⚠️ {agentInfo.agent.disclaimers[0]}
                                </div>
                            )}

                            {/* Messages */}
                            <div className="h-96 overflow-y-auto mb-4 scroll-to-bottom">
                                {messages.map(message => (
                                    <div
                                        key={message.id}
                                        className={`mb-4 message-bubble ${
                                            message.type === 'user' ? 'text-right' : ''
                                        }`}
                                    >
                                        <div
                                            className={`inline-block max-w-3xl px-4 py-3 rounded-2xl ${
                                                message.type === 'user'
                                                    ? 'bg-white text-gray-800'
                                                    : message.type === 'system'
                                                    ? 'bg-green-500 bg-opacity-20 text-white mx-auto'
                                                    : 'bg-white bg-opacity-10 text-white'
                                            }`}
                                        >
                                            {message.type === 'agent' && (
                                                <div className="flex items-center space-x-2 mb-2">
                                                    <span className="text-xl">🦄</span>
                                                    <span className="font-medium">Dr. Glitter Mane</span>
                                                </div>
                                            )}
                                            {message.type === 'user' && (
                                                <div className="flex items-center justify-end space-x-2 mb-2">
                                                    <span className="font-medium">You</span>
                                                    <span className="text-xl">👤</span>
                                                </div>
                                            )}
                                            <div
                                                className="prose prose-sm max-w-none"
                                                dangerouslySetInnerHTML={formatContent(message.content)}
                                            />
                                            <div className="text-xs opacity-50 mt-2">
                                                {new Date(message.timestamp).toLocaleTimeString()}
                                            </div>
                                        </div>
                                    </div>
                                ))}

                                {isTyping && (
                                    <div className="mb-4">
                                        <div className="typing-indicator">
                                            <span></span>
                                            <span></span>
                                            <span></span>
                                        </div>
                                    </div>
                                )}

                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Area */}
                            <div className="flex space-x-3">
                                <input
                                    type="text"
                                    value={inputMessage}
                                    onChange={(e) => setInputMessage(e.target.value)}
                                    onKeyPress={(e) => {
                                        if (e.key === 'Enter' && !e.shiftKey) {
                                            e.preventDefault();
                                            sendMessage();
                                        }
                                    }}
                                    placeholder="Describe your symptoms or ask a medical question..."
                                    className="flex-1 px-4 py-3 bg-white bg-opacity-10 border border-white border-opacity-20 rounded-xl text-white placeholder-white placeholder-opacity-50 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-30"
                                />
                                <button
                                    onClick={sendMessage}
                                    disabled={isTyping || !inputMessage.trim()}
                                    className="px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-xl font-medium hover:from-purple-600 hover:to-pink-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center space-x-2"
                                >
                                    <span>Send</span>
                                    <span>✨</span>
                                </button>
                            </div>

                            {/* Quick Actions */}
                            <div className="mt-4 flex flex-wrap gap-2">
                                <button
                                    onClick={() => setInputMessage('I have a headache that has lasted for 3 days')}
                                    className="px-3 py-1 text-xs bg-white bg-opacity-10 rounded-lg hover:bg-opacity-20 transition-all text-white"
                                >
                                    💊 Symptom Analysis
                                </button>
                                <button
                                    onClick={() => setInputMessage('Can you review my recent lab results?')}
                                    className="px-3 py-1 text-xs bg-white bg-opacity-10 rounded-lg hover:bg-opacity-20 transition-all text-white"
                                >
                                    🔬 Lab Review
                                </button>
                                <button
                                    onClick={() => setInputMessage('What medications might help with my condition?')}
                                    className="px-3 py-1 text-xs bg-white bg-opacity-10 rounded-lg hover:bg-opacity-20 transition-all text-white"
                                >
                                    💉 Medication Advice
                                </button>
                                <button
                                    onClick={() => setInputMessage('Should I see a specialist for this?')}
                                    className="px-3 py-1 text-xs bg-white bg-opacity-10 rounded-lg hover:bg-opacity-20 transition-all text-white"
                                >
                                    👨‍⚕️ Specialist Referral
                                </button>
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="mt-4 text-center text-white text-xs opacity-75">
                            <p>🦄 Dr. Glitter Mane v1.0 | UC2 Platform</p>
                            <p className="mt-1">Remember: Always consult with your healthcare provider for medical decisions</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<DrGlitterManeApp />);
    </script>
</body>
</html>
