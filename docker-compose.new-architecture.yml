version: '3.8'

services:
  # ============================================================================
  # VECTOR DATABASE (Qdrant) - for Mem0
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: battalion-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - battalion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # GRAPH DATABASE (Neo4j) - Optional for Mem0g
  # ============================================================================
  neo4j:
    image: neo4j:latest
    container_name: battalion-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    restart: unless-stopped
    networks:
      - battalion-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - graph-memory  # Only start if graph memory is needed

  # ============================================================================
  # LITELLM PROXY - Multi-provider LLM gateway
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:latest
    container_name: battalion-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_API_KEY:-sk-litellm-master-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_AI_API_KEY}
      - DATABASE_URL=postgresql://litellm:REMOVED@postgres:5432/litellm
    command: --config /app/config.yaml --port 4000
    restart: unless-stopped
    networks:
      - battalion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
    profiles:
      - litellm  # Optional, only if using LiteLLM proxy

  # ============================================================================
  # POSTGRESQL - Main database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: battalion-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=battalion
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-battalion-password}
      - POSTGRES_DB=battalion
      - POSTGRES_MULTIPLE_DATABASES=battalion,litellm
    restart: unless-stopped
    networks:
      - battalion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battalion"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS - Caching and sessions (optional)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: battalion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - battalion-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - full  # Optional service

  # ============================================================================
  # UNICORN BATTALION BACKEND - Main application
  # ============================================================================
  battalion-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: battalion-backend
    ports:
      - "8112:8112"
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=8112
      - DATABASE_URL=postgresql://battalion:${POSTGRES_PASSWORD:-battalion-password}@postgres:5432/battalion
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NEO4J_URL=${NEO4J_URL:-bolt://neo4j:7687}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - LITELLM_PROXY_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-litellm-master-key}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    restart: unless-stopped
    networks:
      - battalion-network
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8112/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - full  # Include in full stack

volumes:
  qdrant_storage:
    name: battalion-qdrant-storage
  neo4j_data:
    name: battalion-neo4j-data
  neo4j_logs:
    name: battalion-neo4j-logs
  postgres_data:
    name: battalion-postgres-data
  redis_data:
    name: battalion-redis-data

networks:
  battalion-network:
    name: battalion-network
    driver: bridge
