version: '3.8'

services:
  # Main API Service
  brigade-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brigade-api
    ports:
      - "8100:8100"
    # Load the full .env so documented keys (BRIGADE_ADMIN_KEY, REMOVED
    # settings, integration tokens, etc.) actually reach the container. The
    # explicit `environment:` entries below override .env where both are set.
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8100
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - QDRANT_URL=http://brigade-qdrant:6333
      - POSTGRES_HOST=brigade-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-brigade}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-brigade}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-brigade}:${POSTGRES_PASSWORD}@brigade-postgres:5432/${POSTGRES_DB:-brigade}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-brigade}:${POSTGRES_PASSWORD}@brigade-postgres:5432/${POSTGRES_DB:-brigade}
      - REDIS_HOST=brigade-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      - brigade-postgres
      - brigade-redis
      - brigade-qdrant
    networks:
      - brigade-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # React/Vite Frontend via Nginx
  brigade-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brigade-frontend
    ports:
      - "3000:80"
    depends_on:
      - brigade-api
    networks:
      - brigade-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL Database
  brigade-postgres:
    image: postgres:16-alpine
    container_name: brigade-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-brigade}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-brigade}
    ports:
      - "5432:5432"
    volumes:
      - brigade-postgres-data:/var/lib/postgresql/data
    networks:
      - brigade-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brigade}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  brigade-redis:
    image: redis:7.4-alpine
    container_name: brigade-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - brigade-redis-data:/data
    networks:
      - brigade-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  brigade-qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: brigade-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - brigade-qdrant-data:/qdrant/storage
    networks:
      - brigade-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  brigade-network:
    driver: bridge

volumes:
  brigade-postgres-data:
  brigade-redis-data:
  brigade-qdrant-data:
